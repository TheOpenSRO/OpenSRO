# Prometheus for OpenSRO. The prod server's metrics arrive by remote write from
# Alloy on its host (the game server's /metrics stays bound to 127.0.0.1 there),
# so the only scrapes here are the stack's own.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (round 858): rules only, no Alertmanager yet; firing alerts show
# in Prometheus's /alerts and in Grafana's Alerting > Alert rules.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
