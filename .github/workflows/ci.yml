name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Build & test server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srrevamp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRREVAMP_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/srrevamp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v

  client:
    name: Validate client (Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import & check project
        working-directory: client
        run: |
          godot --headless --path . --import --quit

      - name: Check every script and scene compiles
        working-directory: client
        run: godot --headless --path . --script res://tools/check_scripts.gd

      - name: Run GDScript tests
        working-directory: client
        run: |
          # Discovered, not listed. The list this replaced had drifted to 55
          # entries against 56 test files in the repo, so a test could be
          # added and silently never run -- the failure mode a test suite
          # exists to prevent.
          set -o pipefail
          failed=0
          count=0
          for t in $(find scripts -name '*_test.gd' | sort); do
            count=$((count + 1))
            if ! godot --headless --path . --script "res://$t"; then
              echo "::error file=client/$t::GDScript test failed"
              failed=1
            fi
          done
          echo "ran $count GDScript test(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no GDScript tests were discovered"
            exit 1
          fi
          exit $failed

  no-assets-check:
    name: Guard against committed pk2/game assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if any pk2/original asset files are committed
        run: |
          if git ls-files | grep -iE '\.(pk2|gr2|ddj|bms|bsr|bmt|ban|bsk|efp)$'; then
            echo "::error::Committed game data files found. This repo must never contain original pk2/asset files."
            exit 1
          fi
          echo "No disallowed asset files found."
