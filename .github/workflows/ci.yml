name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

jobs:
  server:
    name: Build & test server (Go)
    runs-on: [self-hosted, opensro-pve]
    # Bounded (OURS): a stalled step held the only runner for 10+ min on 2026-10-01.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opensro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENSRO_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/opensro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1 runs one package at a time. Twenty-one test files truncate
        # shared tables (inventory_slots, equipment_slots, characters and
        # the rest) in the one test database, so packages running in
        # parallel clear each other's rows mid-test. It surfaced as
        # internal/shop failing with a duplicate key on inventory slot 0:
        # its insert raced another package's, both having just been told
        # the slot was free.
        run: go test ./... -v -p 1

  client:
    name: Validate client (Godot)
    runs-on: [self-hosted, opensro-pve]
    # Bounded (OURS): a stalled step held the only runner for 10+ min on 2026-10-01.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import & check project
        working-directory: client
        run: |
          godot --headless --path . --import --quit

      - name: Check every script and scene compiles
        working-directory: client
        run: godot --headless --path . --script res://tools/check_scripts.gd

      # No native library here, on purpose: this is the client a player
      # without opensro_native.dll runs (Godot prints its extension-load
      # errors, then every reader is GDScript). The "native" job below runs
      # the same suites with the library loaded.
      - name: Run GDScript tests
        working-directory: client
        run: bash tools/run_gd_tests.sh

  native:
    name: Native readers (Rust) and the suites with the library loaded
    runs-on: [self-hosted, opensro-pve]
    # Bounded (OURS): a stalled step held the only runner for 10+ min on 2026-10-01.
    timeout-minutes: 40
    env:
      # Same pin as release.yml.
      RUST_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v5
      # Not cached, on purpose (MEASURED, probe run 36808460104): with nothing
      # cached, installing the toolchain took 43 s and building both libraries
      # 36 s, while saving the 1.9 GB a cache would hold (rustup, zig,
      # native/target) to this runner's cache service was still running after
      # five minutes. hashFiles() also failed outright here (probe run
      # 36807629459).
      - name: Install the native build toolchain
        run: bash native/ci_toolchain.sh
        timeout-minutes: 15
      - name: Test the native core (Blowfish, pk2, ddj; no Godot)
        working-directory: native
        run: cargo test --locked --no-default-features
      - name: Build the release .so and check it
        run: |
          native/build.sh linux-release
          bash client/tools/check_native_library.sh client/native_bin/libopensro_native.so linux
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import the project
        working-directory: client
        run: godot --headless --path . --import --quit
      - name: Run GDScript tests with the native library loaded
        working-directory: client
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/pk2/native_status_test.gd | tee /tmp/native_status.log
          # Anchored: the test also prints sample lines, indented, that contain
          # the same words whether or not a library loaded (round 668's review, M1).
          grep -q '^NativeAssets: native readers ON' /tmp/native_status.log || { echo "::error::the library did not load"; exit 1; }
          bash tools/run_gd_tests.sh

  no-assets-check:
    name: Guard against committed pk2/game assets
    runs-on: [self-hosted, opensro-pve]
    # Bounded (OURS): a stalled step held the only runner for 10+ min on 2026-10-01.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fail if any pk2/original asset files are committed
        run: |
          if git ls-files | grep -iE '\.(pk2|gr2|ddj|bms|bsr|bmt|ban|bsk|efp)$'; then
            echo "::error::Committed game data files found. This repo must never contain original pk2/asset files."
            exit 1
          fi
          echo "No disallowed asset files found."
