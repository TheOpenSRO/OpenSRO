name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Build & test server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srrevamp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRREVAMP_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/srrevamp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v

  client:
    name: Validate client (Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import & check project
        working-directory: client
        run: godot --headless --path . --import --quit
      - name: Run GDScript tests
        working-directory: client
        run: |
          godot --headless --path . --script res://scripts/pk2/blowfish_test.gd
          godot --headless --path . --script res://scripts/pk2/pk2_reader_test.gd
          godot --headless --path . --script res://scripts/net/packet_test.gd
          godot --headless --path . --script res://scripts/net/auth_test.gd
          godot --headless --path . --script res://scripts/net/character_test.gd
          godot --headless --path . --script res://scripts/net/world_test.gd
          godot --headless --path . --script res://scripts/net/inventory_test.gd
          godot --headless --path . --script res://scripts/net/equipment_test.gd
          godot --headless --path . --script res://scripts/net/shop_test.gd
          godot --headless --path . --script res://scripts/net/combat_test.gd
          godot --headless --path . --script res://scripts/net/skill_test.gd
          godot --headless --path . --script res://scripts/net/party_test.gd
          godot --headless --path . --script res://scripts/net/guild_test.gd
          godot --headless --path . --script res://scripts/net/chat_test.gd
          godot --headless --path . --script res://scripts/net/quest_test.gd

  no-assets-check:
    name: Guard against committed pk2/game assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if any pk2/original asset files are committed
        run: |
          if git ls-files | grep -iE '\.(pk2|gr2|ddj)$'; then
            echo "::error::Committed game data files found. This repo must never contain original pk2/asset files."
            exit 1
          fi
          echo "No disallowed asset files found."
