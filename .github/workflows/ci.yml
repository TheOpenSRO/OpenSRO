name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  server:
    name: Build & test server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srrevamp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SRREVAMP_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/srrevamp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v

  client:
    name: Validate client (Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false
      - name: Import & check project
        working-directory: client
        run: godot --headless --path . --import --quit
      - name: Run GDScript tests
        working-directory: client
        run: |
          godot --headless --path . --script res://scripts/pk2/blowfish_test.gd
          godot --headless --path . --script res://scripts/pk2/pk2_reader_test.gd
          godot --headless --path . --script res://scripts/ddj/ddj_reader_test.gd
          godot --headless --path . --script res://scripts/bms/bms_reader_test.gd
          godot --headless --path . --script res://scripts/bms/bms_collision_test.gd
          godot --headless --path . --script res://scripts/bsr/bsr_reader_test.gd
          godot --headless --path . --script res://scripts/bmt/inflate_test.gd
          godot --headless --path . --script res://scripts/bmt/bmt_reader_test.gd
          godot --headless --path . --script res://scripts/ban/ban_reader_test.gd
          godot --headless --path . --script res://scripts/bsk/bsk_reader_test.gd
          godot --headless --path . --script res://scripts/mapo/mapo_reader_test.gd
          godot --headless --path . --script res://scripts/mapo/mapo2_reader_test.gd
          godot --headless --path . --script res://scripts/mapm/mapm_reader_test.gd
          godot --headless --path . --script res://scripts/mapt/mapt_reader_test.gd
          godot --headless --path . --script res://scripts/tile2d/tile_index_reader_test.gd
          godot --headless --path . --script res://scripts/nvm/nvm_reader_test.gd
          godot --headless --path . --script res://scripts/nvm/nvm_collision_test.gd
          godot --headless --path . --script res://scripts/nvm/nvm_water_test.gd
          godot --headless --path . --script res://scripts/nav/nav_graph_test.gd
          godot --headless --path . --script res://scripts/regioninfo/regioninfo_reader_test.gd
          godot --headless --path . --script res://scripts/efp/efp_reader_test.gd
          godot --headless --path . --script res://scripts/assets/skeleton_pose_test.gd
          godot --headless --path . --script res://scripts/assets/skeleton3d_builder_test.gd
          godot --headless --path . --script res://scripts/assets/object_loader_test.gd
          godot --headless --path . --script res://scripts/assets/character_assembler_test.gd
          godot --headless --path . --script res://scripts/assets/monster_assembler_test.gd
          godot --headless --path . --script res://scripts/assets/asset_source_test.gd
          godot --headless --path . --script res://scripts/assets/pk2_config_test.gd
          godot --headless --path . --script res://scripts/update/update_checker_test.gd
          godot --headless --path . --script res://scripts/assets/mapm_terrain_builder_test.gd
          godot --headless --path . --script res://scripts/environment/environment_reader_test.gd
          godot --headless --path . --script res://scripts/cpd/cpd_reader_test.gd
          godot --headless --path . --script res://scripts/objidx/objidx_reader_test.gd
          godot --headless --path . --script res://scripts/net/packet_test.gd
          godot --headless --path . --script res://scripts/net/packet_reader_test.gd
          godot --headless --path . --script res://scripts/net/auth_test.gd
          godot --headless --path . --script res://scripts/net/character_test.gd
          godot --headless --path . --script res://scripts/net/world_test.gd
          godot --headless --path . --script res://scripts/net/inventory_test.gd
          godot --headless --path . --script res://scripts/net/equipment_test.gd
          godot --headless --path . --script res://scripts/net/shop_test.gd
          godot --headless --path . --script res://scripts/net/combat_test.gd
          godot --headless --path . --script res://scripts/net/skill_test.gd
          godot --headless --path . --script res://scripts/net/party_test.gd
          godot --headless --path . --script res://scripts/net/guild_test.gd
          godot --headless --path . --script res://scripts/net/chat_test.gd
          godot --headless --path . --script res://scripts/net/quest_test.gd
          godot --headless --path . --script res://scripts/net/duel_test.gd
          godot --headless --path . --script res://scripts/net/trade_test.gd
          godot --headless --path . --script res://scripts/net/friend_test.gd
          godot --headless --path . --script res://scripts/ui/ui_text_table_test.gd
          godot --headless --path . --script res://scripts/ui/ui_layout_parser_test.gd
          godot --headless --path . --script res://scripts/ui/ui_builder_test.gd
          godot --headless --path . --script res://scripts/ui/hud/hud_minimap_test.gd
          godot --headless --path . --script res://scripts/ui/hud/hud_underbar_test.gd

  no-assets-check:
    name: Guard against committed pk2/game assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if any pk2/original asset files are committed
        run: |
          if git ls-files | grep -iE '\.(pk2|gr2|ddj|bms|bsr|bmt|ban|bsk|efp)$'; then
            echo "::error::Committed game data files found. This repo must never contain original pk2/asset files."
            exit 1
          fi
          echo "No disallowed asset files found."
