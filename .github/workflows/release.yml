name: Release client

# Builds downloadable client binaries (Windows + Linux) and attaches them to
# a GitHub Release. Triggered by pushing a tag like "v0.1.0", or manually via
# workflow_dispatch for a test build. Never bundles any real game data (see
# docs/LEGAL.md) -- each build ships with an empty "pk2" folder next to the
# executable, and a README telling the user to copy their own *.pk2 files
# there themselves.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    name: Build & Release Client
    runs-on: [self-hosted, opensro-release]
    # Bounded (OURS): a stalled step held the only runner for 10+ min on 2026-10-01.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # The native readers' toolchain (native/README.md). Bump it here and in
      # ci.yml together.
      RUST_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Godot (with export templates)
        # Round 760: Godot 4.7.2 (round 754's spike; setup-godot v2.4.3 resolves the
        # 4.7.2 assets and installs the templates under export_templates/4.7.2.stable).
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Set real client version from the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: client
        run: |
          sed -i "s/const CLIENT_VERSION := \"v0.0.0\"/const CLIENT_VERSION := \"${{ github.ref_name }}\"/" scripts/update/update_checker.gd
          grep "CLIENT_VERSION" scripts/update/update_checker.gd

      # Embeds a real, read-only, this-repo-only GitHub PAT (see
      # UpdateChecker.GITHUB_TOKEN's own doc comment for the real tradeoff)
      # so a downloaded client can check/download updates from this real
      # *private* repo's Releases API. No-op (stays empty) if the real
      # UPDATE_CHECK_TOKEN secret was never set -- an honest "no update
      # checking against a private repo" rather than a broken build.
      - name: Embed the real update-check token
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATE_CHECK_TOKEN != ''
        working-directory: client
        env:
          UPDATE_CHECK_TOKEN: ${{ secrets.UPDATE_CHECK_TOKEN }}
        run: |
          sed -i "s/const GITHUB_TOKEN := \"\"/const GITHUB_TOKEN := \"${UPDATE_CHECK_TOKEN}\"/" scripts/update/update_checker.gd

      # The in-client Help window (ESC -> Help, /help) renders Markdown bundled
      # under client/docs/. Regenerate it here so the shipped copies are the
      # docs/ of the tagged commit and RELEASE_NOTES.md lists the real tags
      # (the default checkout is shallow and has none).
      - name: Bundle the in-client docs
        run: |
          git fetch --tags --force --quiet || true
          bash client/tools/bundle_docs.sh

      # The native (Rust) asset readers, round 667/668 (native/README.md, "CI"):
      # opensro_native.dll (x86_64-pc-windows-gnu) and libopensro_native.so,
      # built before the import so the editor sees the library the
      # .gdextension names, and before the exports so each zip carries its
      # platform's library next to the executable. The toolchain is pinned.
      # Not cached, on purpose (MEASURED, probe run 36808460104): with nothing
      # cached, installing the toolchain took 43 s and building both libraries
      # 36 s, while saving the 1.9 GB a cache would hold (rustup, zig,
      # native/target) to this runner's cache service was still running after
      # five minutes. hashFiles() also failed outright here (probe run
      # 36807629459).
      - name: Install the native build toolchain
        run: bash native/ci_toolchain.sh
        timeout-minutes: 15

      - name: Build the native readers (Linux .so, Windows .dll)
        run: |
          set -euo pipefail
          native/build.sh linux-release
          native/build.sh windows
          bash client/tools/check_native_library.sh client/native_bin/opensro_native.dll windows
          bash client/tools/check_native_library.sh client/native_bin/libopensro_native.so linux

      - name: Import project
        working-directory: client
        run: |
          godot --headless --path . --import --quit

      - name: Check every script and scene compiles
        working-directory: client
        run: godot --headless --path . --script res://tools/check_scripts.gd

      # Godot's own licence and the notices of everything built into it, from
      # the engine itself, for THIRD_PARTY_NOTICES.txt (native/third_party_notice.sh).
      - name: Collect Godot Engine's licence notices
        working-directory: client
        run: godot --headless --path . --script res://tools/print_godot_licenses.gd -- --out="${RUNNER_TEMP}/godot_licenses.txt"

      - name: Export Windows Desktop
        working-directory: client
        run: |
          mkdir -p build/windows dist/opensro-windows/pk2
          godot --headless --path . --export-release "Windows Desktop" build/windows/OpenSRO.exe
          cp -r build/windows/. dist/opensro-windows/
          # Round 693: Forward+ is the default and Godot 4.2.2 did not fall
          # back to OpenGL when Vulkan fails, so a PC without Vulkan starts
          # once through this (RendererChoice remembers it). Round 760:
          # 4.4+ falls back by itself (rendering/rendering_device/
          # fallback_to_opengl3, default true); the launcher stays as the
          # player's explicit choice.
          cp launchers/opensro-compatibility.bat dist/opensro-windows/
          cp ../README.md dist/opensro-windows/README.md || true
          bash ../native/third_party_notice.sh x86_64-pc-windows-gnu "${RUNNER_TEMP}/godot_licenses.txt" > dist/opensro-windows/THIRD_PARTY_NOTICES.txt
          cat > dist/opensro-windows/pk2/PUT_YOUR_PK2_FILES_HERE.txt <<'EOF'
          Copy your own real Silkroad Online client's *.pk2 files into this
          folder (Data.pk2, Map.pk2, Media.pk2, at minimum) before running
          the client. This project ships with no game data of its own --
          see docs/LEGAL.md in the source repository for why.
          EOF
          cd dist && zip -r opensro-windows.zip opensro-windows

      - name: Export Linux
        working-directory: client
        run: |
          mkdir -p build/linux dist/opensro-linux/pk2
          godot --headless --path . --export-release "Linux" build/linux/OpenSRO.x86_64
          cp -r build/linux/. dist/opensro-linux/
          cp launchers/opensro-compatibility.sh dist/opensro-linux/
          cp ../README.md dist/opensro-linux/README.md || true
          bash ../native/third_party_notice.sh x86_64-unknown-linux-gnu "${RUNNER_TEMP}/godot_licenses.txt" > dist/opensro-linux/THIRD_PARTY_NOTICES.txt
          cat > dist/opensro-linux/pk2/PUT_YOUR_PK2_FILES_HERE.txt <<'EOF'
          Copy your own real Silkroad Online client's *.pk2 files into this
          folder (Data.pk2, Map.pk2, Media.pk2, at minimum) before running
          the client. This project ships with no game data of its own --
          see docs/LEGAL.md in the source repository for why.
          EOF
          chmod +x dist/opensro-linux/OpenSRO.x86_64 dist/opensro-linux/opensro-compatibility.sh || true
          cd dist && zip -r opensro-linux.zip opensro-linux

      # Both zips must carry their library where the exported game looks for
      # it (next to the executable; OS::open_dynamic_library falls back to the
      # executable's folder -- unchanged in 4.7.2), and the Linux build must
      # actually load it: the exported game is run headless and its own log
      # line is checked. The Windows build cannot be run here.
      - name: Check the zips carry the native library, and the Linux build loads it
        working-directory: client
        run: |
          set -euo pipefail
          bash tools/check_release_zip.sh dist/opensro-windows.zip windows
          bash tools/check_release_zip.sh dist/opensro-linux.zip linux
          bash tools/check_release_zip.sh dist/opensro-linux.zip linux --run

      # A test build (workflow_dispatch, no tag) keeps its zips for three days
      # so they can be downloaded and checked without publishing a release.
      - name: Keep a test build's zips
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: opensro-test-build
          path: |
            client/dist/opensro-windows.zip
            client/dist/opensro-linux.zip
          retention-days: 3

      # The release body is the tag's own annotation -- the human changelog
      # written when the tag was cut -- with GitHub's generated commit list
      # appended after it. It used to be the generated list alone, which is a
      # condensed set of commit subjects; testers asked for the actual
      # changes without leaving the client or reading GitHub (2026-09-25).
      - name: Write the release body from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force --quiet || true
          {
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed -e 's/[[:space:]]*$//'
          } > "${RUNNER_TEMP}/release_body.md"
          if [ ! -s "${RUNNER_TEMP}/release_body.md" ]; then
            echo "(no tag message)" > "${RUNNER_TEMP}/release_body.md"
          fi
          cat "${RUNNER_TEMP}/release_body.md"

      # "Latest" goes to the highest version tag, not to whichever run ends
      # last: two tags pushed minutes apart (v0.1.589, v0.1.590) finished out
      # of order and left the older one marked Latest.
      - name: Decide whether this is the latest release
        if: startsWith(github.ref, 'refs/tags/v')
        id: latest
        shell: bash
        run: |
          highest=$(git ls-remote --tags --refs origin 'v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -1)
          echo "highest tag: ${highest}, this tag: ${GITHUB_REF_NAME}"
          if [ "${highest}" = "${GITHUB_REF_NAME}" ]; then
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "make_latest=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: |
            client/dist/opensro-windows.zip
            client/dist/opensro-linux.zip
          body_path: ${{ runner.temp }}/release_body.md
          generate_release_notes: true
