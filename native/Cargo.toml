[package]
name = "opensro_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native pk2 archive reader and asset parsers for the OpenSRO client (round 667 spike)"
license = "MIT"

[lib]
# cdylib: the GDExtension library Godot loads. rlib: so `cargo test` and a
# later C-ABI/static build can link the plain-Rust core without Godot.
crate-type = ["cdylib", "rlib"]

[features]
default = ["godot-binding"]
# The thin gdext layer (src/gd.rs). Off, the crate is the plain core only.
godot-binding = ["dep:godot"]
# The parity check's NEGATIVE (native/README.md, "Parity"): two deliberate, subtle bugs -- a
# directory block's 20th entry is dropped, and an uncompressed texture's red and blue are
# swapped. A build with this feature must FAIL client/tools/native_parity.gd. Never shipped.
parity-negative = []

[dependencies]
# Inflate for the .pk3 (zip) asset packs (round 789, core::pk3): plain Rust, no C. Licence
# "MIT OR Zlib OR Apache-2.0" (cargo-about takes MIT, native/about.toml); its one dependency,
# adler2, is "0BSD OR MIT OR Apache-2.0". The default feature is only its allocator.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# The CRC-32 check of every inflated pack entry (round 789): "MIT OR Apache-2.0", its one
# dependency cfg-if too. Runtime-detected SIMD (std).
crc32fast = { version = "=1.5.2", default-features = true }
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7", "experimental-threads"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
